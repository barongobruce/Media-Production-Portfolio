<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bruce Visuals</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header>
    <h1>Bruce Focus</h1>
    <nav>
      <a href="#services">Services</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="services" class="services">
    <h2>Our Services</h2>
    <ul>
      <li>Studio</li>
      <li>Outdoors</li>
      <li>Weddings</li>
      <li>Baby Shower</li>
      <li>Corporate</li>
    </ul>
  </section>

  <section id="gallery">
    <h2>Gallery</h2>

    <div class="controls">
      <input id="search" type="search" placeholder="Search captions..." />
      <select id="category-filter">
        <option value="All">All Categories</option>
      </select>
      <button id="clear-filters" title="Clear filters">Clear</button>
    </div>

    <div id="gallery-container" class="gallery"></div>
  </section>

  <section id="contact">
    <h2>Contact Us</h2>
    <div class="social">
      <a href="https://wa.me/254710802808" target="_blank" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
      </a>
      <a href="https://instagram.com/brucee_focus" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
    </div>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
